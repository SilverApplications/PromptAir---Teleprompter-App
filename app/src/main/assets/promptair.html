:root{
  /* Silver Applications – Anthrazit + Petrol + Silber */
  --bg:#15181B; --panel:#1E2328; --panel2:#262C32; --line:#3A4148;
  --txt:#F4F5F6; --dim:#9BA3AB; --accent:#3FA893; --accent2:#2E9180; --accent-deep:#123F39;
  --on-accent:#0E1012; --red:#ff4d4d; --ok:#3FA893;
  --radius:0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--txt);
  font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overscroll-behavior:none}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
.view{display:none; min-height:100dvh}
.view.on{display:flex; flex-direction:column}

/* ---------- HOME ---------- */
header.app{display:flex; align-items:center; gap:12px; padding:18px 18px 10px}
header.app .logo{width:40px; height:38px; display:block}
header.app h1{font-size:26px; margin:0; letter-spacing:-.02em; font-weight:300}
header.app h1 b{color:var(--txt); font-weight:600}
header.app .spacer{flex:1}
.iconbtn{width:44px; height:44px; display:grid; place-items:center; border-radius:0; background:var(--panel); border:1px solid var(--line); color:var(--txt)}
.iconbtn:hover{border-color:var(--dim)}
.iconbtn:active{background:var(--panel2)}
.iconbtn svg,.btn svg,.fab svg{width:20px;height:20px;display:block}
.btn svg,.fab svg{width:16px;height:16px}
#homeList{flex:1; padding:8px 16px 110px; overflow:auto}
.card{background:linear-gradient(var(--panel),var(--bg)); border:1px solid var(--line); border-radius:0;
  padding:14px 16px; margin-bottom:12px; width:100%; text-align:left; display:block}
.card:active{border-color:var(--accent)}
.card h3{margin:0 0 4px; font-size:17px; font-weight:600}
.card p{margin:0; color:var(--dim); font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .meta{margin-top:8px; font:400 11.5px/1.4 'IBM Plex Mono',monospace; letter-spacing:.04em; color:var(--dim)}
.empty{color:var(--dim); text-align:center; margin-top:60px; padding:0 30px; line-height:1.6}
.fab{position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:5; background:var(--accent-deep, #1D7A6E);
  color:#fff; font-weight:500; font-size:15px; letter-spacing:.02em; padding:16px 22px; border-radius:0;
  border:1px solid #1D7A6E; display:flex; align-items:center; gap:10px}
.fab:active{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.hint{font-size:12.5px; color:var(--dim); padding:0 20px 16px; line-height:1.55}

/* ---------- EDITOR ---------- */
#viewEdit{padding:0}
.topbar{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line)}
.topbar .grow{flex:1}
#edTitle{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:0; padding:10px 12px; min-width:0}
#edText{flex:1; width:100%; background:var(--bg); border:none; outline:none; resize:none;
  padding:16px 18px 120px; font-size:17px; line-height:1.65; color:var(--txt)}
.edfoot{position:fixed; left:0; right:0; bottom:0; background:linear-gradient(transparent,var(--bg) 18px);
  padding:24px 16px 18px; display:flex; align-items:center; gap:10px}
.edfoot .stats{flex:1; color:var(--dim); font-size:12.5px; line-height:1.4}
@media (max-width:560px){
  .edfoot{flex-wrap:wrap; gap:8px}
  .edfoot .stats{flex:1 1 100%; font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.03em}
  .edfoot .btn{flex:1 1 0; padding:12px 8px}
  #edText{padding-bottom:170px}
}
.btn{background:var(--panel); border:1px solid var(--line); border-radius:0; padding:12px 16px; font-weight:500; letter-spacing:.02em; color:#D9DDE1;
  display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:#1D7A6E; border-color:#1D7A6E; color:#fff}
.btn.primary:active{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn:active{opacity:.9}

/* ---------- PROMPTER ---------- */
#viewPrompt{position:fixed; inset:0; z-index:10; background:var(--pbg,#000); overflow:hidden; touch-action:none}
#camVideo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; background:#000}
#camVideo.mirror{transform:scaleX(-1)}
#stage{position:absolute; inset:0; overflow:hidden}
#scroller{will-change:transform}
#content{padding:0 6vw; font-weight:600; word-break:break-word}
#content p{margin:0 0 .6em}
#content .w{border-radius:0; padding:0 .06em}
#content .w.read{opacity:.45}
#content .w.now{background:rgba(63,168,147,.28); box-shadow:0 0 0 4px rgba(63,168,147,.28)}
#content .w.nv{opacity:.55; font-style:italic}
#content .w.b{font-weight:800}
#guide{position:absolute; left:0; right:0; pointer-events:none; display:flex; align-items:center}
#guide .tri{width:0;height:0;border:10px solid transparent;border-left:16px solid var(--accent);margin-left:4px}
#guide .ln{flex:1; height:1px; background:var(--accent); opacity:.7; margin-left:6px}
#dimTop,#dimBot{position:absolute; left:0; right:0; pointer-events:none; display:none}
#dimTop{top:0; background:linear-gradient(var(--pbg,#000) 20%,transparent)}
#dimBot{bottom:0; background:linear-gradient(transparent,var(--pbg,#000) 80%)}
.dim-on #dimTop,.dim-on #dimBot{display:block}
#progress{position:absolute; top:0; left:0; height:3px; background:var(--accent); width:0%; z-index:4}
#hud{position:absolute; top:10px; right:12px; z-index:4; font-size:13px; color:#fff; background:rgba(0,0,0,.45);
  padding:6px 10px; border-radius:0; display:flex; gap:10px; align-items:center; font-family:'IBM Plex Mono',monospace; letter-spacing:.04em}
#hud svg{width:14px;height:14px;display:block}
#micDot{width:8px;height:8px;border-radius:0;background:#3A4148}
#micDot.live{background:var(--ok)}
#recBadge{display:none; align-items:center; gap:6px; color:#fff}
#recBadge.on{display:flex}
#recBadge i{width:9px;height:9px;border-radius:50%;background:var(--red); animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#ctlbar{position:absolute; left:0; right:0; bottom:0; z-index:5; padding:10px 10px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.75) 45%);
  display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
  transition:opacity .3s, transform .3s}
#ctlbar.hidden{opacity:0; transform:translateY(20px); pointer-events:none}
.pbtn{min-width:52px; height:52px; padding:0 14px; border-radius:0; background:rgba(21,24,27,.72);
  border:1px solid rgba(155,163,171,.35); display:grid; place-items:center; color:#F4F5F6}
.pbtn svg{width:22px; height:22px}
.pbtn.small{min-width:44px;height:44px}
.pbtn.small svg{width:19px;height:19px}
.pbtn.on{background:rgba(63,168,147,.30); border-color:var(--accent)}
#btnRec{color:var(--red)}

#countdown{position:absolute; inset:0; z-index:6; display:none; place-items:center; background:rgba(0,0,0,.55)}
#countdown span{font-size:26vh; font-weight:300; color:var(--accent); letter-spacing:-.04em}
#toast{position:absolute; top:14%; left:50%; transform:translateX(-50%); z-index:7; background:rgba(0,0,0,.8);
  color:#fff; padding:10px 18px; border-radius:0; border:1px solid var(--line); font-size:14.5px; display:none; max-width:86vw; text-align:center}

/* ---------- SETTINGS DRAWER ---------- */
#drawer{position:fixed; inset:0; z-index:20; display:none}
#drawer.on{display:block}
#drawer .bg{position:absolute; inset:0; background:rgba(0,0,0,.55)}
#drawer .panel{position:absolute; right:0; top:0; bottom:0; width:min(420px,92vw); background:var(--panel);
  border-left:1px solid var(--line); overflow:auto; padding:16px 18px 40px}
#drawer h2{font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin:10px 0 18px}
.set{margin-bottom:16px}
.set label{display:flex; justify-content:space-between; font-size:14px; color:var(--dim); margin-bottom:6px}
.set label output{color:var(--txt); font-weight:600}
.set input[type=range]{width:100%; accent-color:var(--accent)}
.set select,.set input[type=color]{width:100%; background:var(--panel2); border:1px solid var(--line);
  border-radius:0; padding:10px; height:44px}
.setrow{display:flex; gap:10px}
.setrow .set{flex:1}
.switch{display:flex; align-items:center; justify-content:space-between; background:var(--panel2);
  border:1px solid var(--line); border-radius:0; padding:12px 14px; margin-bottom:10px}
.switch span{font-size:15px}
.switch input{width:22px; height:22px; accent-color:var(--accent)}
.sub{font-size:12px; color:var(--dim); margin:-6px 0 14px; line-height:1.5}
hr{border:none; border-top:1px solid var(--line); margin:18px 0}
kbd{background:var(--panel2); border:1px solid var(--line); border-radius:0; font-family:'IBM Plex Mono',monospace; padding:1px 6px; font-size:12px}
.help p{font-size:13.5px; color:var(--dim); line-height:1.7; margin:6px 0}
/* ================= 1.1.0 ================= */
/* ---------- Sichtbarkeit App / Browser ---------- */
html:not(.in-app) .app-only{display:none!important}
html.in-app .web-only{display:none!important}

/* ---------- Startseite: Bedienleiste unten ---------- */
#homeList{padding-bottom:120px}
.homebar{position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; align-items:center; gap:10px;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,var(--bg) 32%)}
.homebar .spacer{flex:1}
.homebar .btn{height:48px; padding:0 16px; white-space:nowrap}
.homebar .iconbtn{width:48px; height:48px; flex:none}
@media (max-width:390px){ .homebar{gap:8px; padding-left:12px; padding-right:12px} .homebar .btn{padding:0 11px; font-size:14px} }
/* Schmale Handys: Knöpfe teilen sich die Breite, lange Beschriftungen (FR/IT/PT) brechen um statt überzustehen */
@media (max-width:480px){ .homebar .spacer{display:none}
  .homebar .btn{flex:1 1 0; min-width:0; white-space:normal; line-height:1.15; text-align:center; justify-content:center; padding:0 10px; font-size:14px}
  .homebar .btn svg{flex:none} }

/* ---------- Meldungen auf allen Bildschirmen sichtbar ---------- */
#toast{position:fixed; z-index:60}

/* ---------- Steuerkreuz (DVD-Fernbedienung) ---------- */
#ctlbar{gap:16px; flex-wrap:nowrap; align-items:center;
  padding:18px 12px calc(18px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,rgba(0,0,0,.8) 35%)}
.ctlside{display:flex; flex-direction:column; gap:10px}
.dpad{--pad:180px; position:relative; flex:none; width:var(--pad); height:var(--pad);
  background:rgba(14,16,18,.82); border:1px solid rgba(155,163,171,.35)}
.dpad .seg{position:absolute; inset:0; border:0; padding:0; border-radius:0; background:rgba(58,65,72,.62); color:#F4F5F6; transition:background .15s}
.dpad .seg:active{background:rgba(63,168,147,.5)}
.dpad .seg svg{position:absolute; width:26px; height:26px; transform:translate(-50%,-50%); pointer-events:none}
.seg.up{clip-path:polygon(5% 0,95% 0,65% 30%,35% 30%)}       .seg.up svg{left:50%; top:14%}
.seg.down{clip-path:polygon(35% 70%,65% 70%,95% 100%,5% 100%)} .seg.down svg{left:50%; top:86%}
.seg.left{clip-path:polygon(0 5%,30% 35%,30% 65%,0 95%)}       .seg.left svg{left:14%; top:50%}
.seg.right{clip-path:polygon(100% 5%,100% 95%,70% 65%,70% 35%)} .seg.right svg{left:86%; top:50%}
#btnMic.on{background:rgba(63,168,147,.55)}
#btnRec{color:var(--red)}
#btnRec.on{background:rgba(255,77,77,.38); color:#fff}
.dpad .center{position:absolute; left:33%; top:33%; width:34%; height:34%; border:0; padding:0; border-radius:0;
  background:#1D7A6E; color:#fff; display:grid; place-items:center}
.dpad .center:active{background:var(--accent); color:var(--on-accent)}
.dpad .center svg{width:32px; height:32px}
@media (max-height:520px){
  .dpad{--pad:138px} .dpad .seg svg{width:21px; height:21px} .dpad .center svg{width:26px; height:26px}
  .ctlside{gap:6px} #ctlbar{padding-top:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom))}
}
@media (min-width:720px) and (min-height:720px){ .dpad{--pad:212px} }

/* ---------- Einstellungen: Rechtliches ---------- */
.legal a{display:block; padding:12px 14px; margin-bottom:8px; border:1px solid var(--line); background:var(--panel2);
  color:var(--txt); text-decoration:none; font-size:15px}
.legal a:active{border-color:var(--accent)}
.legal .ver{font:400 11.5px/1.4 'IBM Plex Mono',monospace; letter-spacing:.04em; color:var(--dim); margin:12px 0 0}

/* ---------- Startsequenz (nur App) ---------- */
#intro{display:none}
html.intro #intro{display:block; position:fixed; inset:0; z-index:100; background:var(--bg); overflow:hidden; transition:opacity .45s ease}
html.intro body{overflow:hidden}
#intro.out{opacity:0; pointer-events:none}
.intro-stage{position:absolute; inset:0; display:grid; place-items:center}
.intro-tile{position:relative; width:min(60vw,62vh); aspect-ratio:1/1; overflow:hidden;
  transform:scale(var(--s0,.16)); background:linear-gradient(145deg,#2A3036 0%,#1E2328 42%,#15181B 100%);
  border:1px solid #3A4148; box-shadow:inset 0 1px 0 rgba(244,245,246,.06)}
.intro-tile svg{position:absolute; inset:0; width:100%; height:100%; display:block}
#intro.run .intro-tile{animation:introGrow 1.25s cubic-bezier(.16,1,.3,1) .12s both}
@keyframes introGrow{from{transform:scale(var(--s0,.16))} to{transform:scale(1)}}
.intro-tile .glint{position:absolute; inset:-50%; pointer-events:none; transform:translateX(-62%);
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.12) 49%,rgba(255,255,255,.03) 55%,transparent 60%)}
#intro.run .glint{animation:introGlint 1.15s cubic-bezier(.4,0,.2,1) 1.2s both}
@keyframes introGlint{from{transform:translateX(-62%)} to{transform:translateX(62%)}}
.intro-tile .sheen{transform:translateX(-80px)}
#intro.run .sheen{animation:introSheen 1.05s cubic-bezier(.4,0,.2,1) 1.0s both}
@keyframes introSheen{from{transform:translateX(-80px)} to{transform:translateX(150px)}}
.intro-tile .spark{opacity:0; transform-box:fill-box; transform-origin:center}
#intro.run .spark{animation:introSpark .85s ease-out both}
#intro.run .spark.s1{animation-delay:1.45s} #intro.run .spark.s2{animation-delay:1.72s}
#intro.run .spark.s3{animation-delay:1.98s} #intro.run .spark.s4{animation-delay:2.2s}
@keyframes introSpark{0%{opacity:0; transform:scale(0) rotate(0deg)} 35%{opacity:1; transform:scale(1.15) rotate(40deg)} 100%{opacity:0; transform:scale(.2) rotate(90deg)}}
.intro-sa{position:absolute; left:0; right:0; bottom:calc(34px + env(safe-area-inset-bottom)); display:flex; align-items:center;
  justify-content:center; gap:10px; opacity:0; font:400 12.5px/1 'IBM Plex Sans',sans-serif; letter-spacing:.14em; color:#9BA3AB}
.intro-sa b{color:#F4F5F6; font-weight:600}
.intro-sa svg{width:24px; height:24px; display:block}
#intro.run .intro-sa{animation:introFade .8s ease-out .55s both}
@keyframes introFade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  #intro.run .intro-tile{animation:none; transform:none}
  #intro.run .sheen,#intro.run .glint,#intro.run .spark{animation:none}
  #intro.run .intro-sa{animation:none; opacity:1}
}
#micDot.live.hold{background:#E0A84B}

/* ============ Android-Bridge: native Spracherkennung im WebView ============ */
if(!window.SpeechRecognition && !window.webkitSpeechRecognition && window.AndroidSpeech){
  window.__speechCb=null;
  window.__onSpeech=function(text,isFinal){ if(window.__speechCb) window.__speechCb(text,isFinal); };
  window.SpeechRecognition=function(){
    const self=this;
    this.lang='de-DE'; this.continuous=true; this.interimResults=true;
    this.onresult=null; this.onend=null; this.onerror=null;
    this.start=function(){
      let utt=0;
      window.__speechCb=function(text,isFinal){
        const r=[{transcript:text}]; r.isFinal=!!isFinal;
        if(self.onresult) self.onresult({resultIndex:0,results:[r],__utt:utt});
        if(isFinal) utt++;
      };
      AndroidSpeech.start(self.lang);
    };
    this.stop=function(){ window.__speechCb=null; AndroidSpeech.stop(); if(self.onend) self.onend(); };
  };
}

function resolveLang(pref){
  if(pref&&pref!=='auto'&&I18N[pref]) return pref;
  for(const l of (navigator.languages||[navigator.language||'en'])){ const k=String(l).slice(0,2).toLowerCase(); if(I18N[k]) return k; }
  return 'en';
}
function t(k,vars){
  let s=(I18N[L]&&I18N[L][k]!=null)?I18N[L][k]:(I18N.en[k]!=null?I18N.en[k]:(I18N.de[k]!=null?I18N.de[k]:k));
  if(vars) for(const v in vars) s=s.split('{'+v+'}').join(vars[v]);
  return s;
}
function srLang(){ return (!S.lang||S.lang==='auto')?SR_DEFAULT[L]:S.lang; }
function cmdSet(){ return CMDS[srLang().slice(0,2)]||CMDS.en; }
function cmdHelp(){ const c=cmdSet();
  const pick=[c.start[0],c.stop[0],c.faster[0],c.slower[0],c.restart[0]].map(w=>'<b>'+w+'</b>');
  return pick.join(', '); }

/* Blob -> Base64 (ohne data:-Praefix) */
function blobB64(b){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error); r.readAsDataURL(b); }); }
/* Stückweises Schreiben auf das Gerät (Video während der Aufnahme) */
function appSink(name,mime,kind){
  const id=App.beginSave(name,mime,kind); if(!id) return null;
  let q=Promise.resolve(), failed=false;
  return {
    push(blob){ q=q.then(async()=>{ if(failed) return;
      for(let o=0;o<blob.size;o+=768*1024){ if(!App.saveChunk(id,await blobB64(blob.slice(o,o+768*1024)))){ failed=true; return; } } }); },
    async close(){ await q; if(failed){ App.abortSave(id); return 'save_failed'; } return App.endSave(id); }
  };
}

};

const mem={};
const store={
  async get(k){ try{ if(window.storage){ const r=await window.storage.get(k); if(r) return r.value; } }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!=null) return v; }catch(e){}
    return (k in mem)?mem[k]:null; },
  async set(k,v){ mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ============ Prompter ============ */
const stage=$('#stage'), scroller=$('#scroller'), content=$('#content');
let tokens=[], pos=0, playing=false, lastT=0, rafId=0, maxPos=0;
let voiceOn=false, voiceTarget=null, matchedIdx=-1, shownIdx=-1, offScript=0, vfHold=false;
let wakeLock=null;

function applyStyle(){
  const vp=$('#viewPrompt');
  const camOn=$('#camVideo').style.display==='block';
  const bgVal=camOn?hexA(S.bgColor,S.camOpacity/100):S.bgColor;
  vp.style.setProperty('--pbg',bgVal);
  content.style.fontSize=S.fontSize+'px';
  content.style.lineHeight=S.lineHeight;
  content.style.color=S.textColor;
  content.style.fontFamily=S.fontFamily;
  content.style.textAlign=S.align;
  content.style.paddingLeft=content.style.paddingRight=S.marginPct+'vw';
  vp.style.background=bgVal;
  stage.style.transform=(S.mirrorH?'scaleX(-1) ':'')+(S.mirrorV?'scaleY(-1)':'');
  $('#guide').style.display=S.guideShow?'flex':'none';
  $('#guide').style.top=`calc(${S.guidePos}% - 10px)`;
  vp.classList.toggle('dim-on',S.focusDim);
  const g=guidePx();
  content.style.paddingTop=g+'px';
  content.style.paddingBottom=stage.clientHeight+'px';
  $('#dimTop').style.height=Math.max(0,g-S.fontSize*S.lineHeight)+'px';
  $('#dimBot').style.height=(stage.clientHeight*.30)+'px';
  measure();
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function guidePx(){ return stage.clientHeight*S.guidePos/100; }
function measure(){ maxPos=Math.max(0,content.scrollHeight-stage.clientHeight); }

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]/gu,'');
function buildContent(text){
  content.innerHTML=''; tokens=[];
  let bold=false, skip=false;
  for(const para of text.replace(/\r/g,'').split('\n')){
    const p=document.createElement('p');
    if(!para.trim()){ p.innerHTML='&nbsp;'; content.appendChild(p); continue; }
    for(const raw of para.split(/\s+/)){
      if(!raw) continue;
      if(raw.includes('<')) skip=true;
      const wasSkip=skip;
      const tog=(raw.match(/\*\*/g)||[]).length;
      const isBold=bold||tog>0;
      if(tog%2===1) bold=!bold;
      if(raw.includes('>')) skip=false;
      const w=raw.replace(/\*\*/g,'').replace(/[<>]/g,'');
      if(!w) continue;
      const span=document.createElement('span');
      span.textContent=w;
      span.className='w'+(wasSkip?' nv':'')+(isBold?' b':'');
      p.appendChild(span); p.appendChild(document.createTextNode(' '));
      tokens.push({el:span,norm:norm(w),voice:!wasSkip});
    }
    content.appendChild(p);
  }
}

function setPos(v){ pos=Math.min(maxPos,Math.max(0,v));
  scroller.style.transform=`translate3d(0,${-pos}px,0)`;
  $('#progress').style.width=maxPos? (pos/maxPos*100)+'%':'0%';
  const rest=Math.max(0,(maxPos-pos)/S.speed);
  if(voiceOn&&S.voiceMode==='follow'){}       /* Anzeige übernimmt updVoiceHud() */
  else $('#timeLeft').textContent=Math.floor(rest/60)+':'+String(Math.round(rest%60)).padStart(2,'0');
}
function tick(ts){
  rafId=requestAnimationFrame(tick);
  const dt=Math.min(.05,(ts-lastT)/1000||0); lastT=ts;
  if(voiceOn&&S.voiceMode==='follow'){
    if(voiceTarget!=null&&Math.abs(voiceTarget-pos)>.5){
      const lineH=S.fontSize*S.lineHeight, maxStep=lineH*4*dt;
      const step=(voiceTarget-pos)*Math.min(1,dt*4);
      setPos(pos+Math.max(-maxStep,Math.min(maxStep,step)));
    }
  } else if(playing){
    setPos(pos+S.speed*dt);
    if(pos>=maxPos){ if(S.loop){ setPos(0);} else { pause(); toast(t('endOfScript')); showCtl(); } }
  }
}

function play(){
  if(voiceOn&&S.voiceMode==='follow'){ playing=true; setPlayBtn(); anchorAtGuide(); setHold(false); hideCtlSoon(); return; }
  if(pos<2 && S.countdown>0 && !(voiceOn&&S.voiceMode==='follow')){ runCountdown(()=>{ playing=true; setPlayBtn(); hideCtlSoon(); }); }
  else { playing=true; setPlayBtn(); hideCtlSoon(); }
}
function pause(){ playing=false; setPlayBtn(); showCtl(); if(voiceOn&&S.voiceMode==='follow'){ voiceTarget=null; updVoiceHud(); } }
function setPlayBtn(){ $('#btnPlay').innerHTML='<svg aria-hidden="true"><use href="#i-'+(playing?'pause':'play')+'"/></svg>'; }
function runCountdown(done){
  const c=$('#countdown'), sp=c.querySelector('span'); let n=S.countdown;
  c.style.display='grid'; sp.textContent=n;
  const iv=setInterval(()=>{ n--; if(n<=0){ clearInterval(iv); c.style.display='none'; done(); } else sp.textContent=n; },1000);
}
function changeSpeed(d){
  S.speed=Math.min(400,Math.max(10,S.speed+d)); syncDrawer(); saveSettings();
  toast(t('speedToast',{v:S.speed+' px/s'}),700);
}

/* Steuerleiste ein-/ausblenden */
let ctlT;
function showCtl(){ $('#ctlbar').classList.remove('hidden'); clearTimeout(ctlT); if(playing) hideCtlSoon(); }
function hideCtlSoon(){ clearTimeout(ctlT); ctlT=setTimeout(()=>$('#ctlbar').classList.add('hidden'),3500); }

/* Gesten: Tippen=Pause, Wischen=Scrollen, Pinch=Schriftgröße */
let tState=null;
stage.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    tState={pinch:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),fs:S.fontSize};
  } else { tState={y:e.touches[0].clientY,p:pos,moved:false,t:Date.now()}; }
},{passive:true});
stage.addEventListener('touchmove',e=>{
  if(!tState) return;
  if(tState.pinch&&e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    S.fontSize=Math.round(Math.min(140,Math.max(18,tState.fs*d/tState.pinch)));
    applyStyle(); syncDrawer();
  } else if(tState.y!=null){
    const dy=tState.y-e.touches[0].clientY;
    if(Math.abs(dy)>8) tState.moved=true;
    const dir=S.mirrorV?-1:1;
    setPos(tState.p+dy*dir); voiceTarget=null;
  }
},{passive:true});
stage.addEventListener('touchend',e=>{
  if(tState&&!tState.pinch&&!tState.moved&&Date.now()-tState.t<400){
    const tp=e.changedTouches&&e.changedTouches[0];
    if(!(tp&&tapWord(document.elementFromPoint(tp.clientX,tp.clientY)))){ playing?pause():play(); }
    showCtl();
  } else if(tState&&tState.moved&&voiceOn&&S.voiceMode==='follow'){ anchorAtGuide(); }
  if(tState&&tState.pinch) saveSettings();
  tState=null;
},{passive:true});
stage.addEventListener('click',e=>{ if(!('ontouchstart'in window)){ if(!tapWord(e.target)){ playing?pause():play(); } showCtl(); }});

/* Tastatur / Bluetooth-Fernbedienung – Pfeile wie das Steuerkreuz: hoch = langsamer, runter = schneller */
document.addEventListener('keydown',e=>{
  if(!views.prompt.classList.contains('on')) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
  const k=e.code;
  if(k==='Space'||k==='Enter'||k==='PageDown'){ e.preventDefault(); playing?pause():play(); }
  else if(k==='ArrowUp'){ e.preventDefault(); changeSpeed(-10); }
  else if(k==='ArrowDown'){ e.preventDefault(); changeSpeed(10); }
  else if(k==='ArrowLeft'||k==='PageUp'){ setPos(pos-stage.clientHeight*.4); voiceTarget=null; anchorAtGuide(); }
  else if(k==='ArrowRight'){ setPos(pos+stage.clientHeight*.4); voiceTarget=null; anchorAtGuide(); }
  else if(k==='Home'){ restart(); }
  else if(k==='KeyM'){ S.mirrorH=!S.mirrorH; applyStyle(); syncDrawer(); }
  else if(k==='KeyF'){ toggleFS(); }
  else if(k==='Escape'){ exitPrompt(); }
  showCtl();
});

function restart(){ const vf=voiceOn&&S.voiceMode==='follow';
  pause(); setPos(0); matchedIdx=-1; shownIdx=-1; voiceTarget=null; offScript=0; vfHold=false;
  tokens.forEach(x=>x.el.classList.remove('read','now')); if(vf){ playing=true; setPlayBtn(); } updVoiceHud(); }

/* ============ Spracherkennung ============ */
let rec=null, recActive=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function showPermDlg(kind,retry){
  const d=$('#permDlg'); d._retry=retry||null;
  const K=kind.charAt(0).toUpperCase()+kind.slice(1);
  $('#permTitle').textContent=t('perm'+K+'T');
  $('#permBody').innerHTML=t('perm'+K+'H');
  $('#permRetry').style.display=(kind==='insecure')?'none':'block';
  d.style.display='grid';
}
async function ensureMic(){
  if(!window.isSecureContext){ showPermDlg('insecure'); return false; }
  let state='prompt';
  if(navigator.permissions&&navigator.permissions.query){
    try{ state=(await navigator.permissions.query({name:'microphone'})).state; }catch(e){}
  }
  if(state==='denied'){ showPermDlg('denied',()=>micToggle()); return false; }
  if(state==='granted') return true;
  showPermDlg('prompt');
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(x=>x.stop());
    $('#permDlg').style.display='none';
    return true;
  }catch(e){
    showPermDlg(e&&e.name==='NotAllowedError'?'denied':'error',()=>micToggle());
    return false;
  }
}
async function micToggle(){
  if(recActive){ stopRec(); return; }
  if(!SR){ toast(t('srUnsupported')); return; }
  if(!window.AndroidSpeech && !(await ensureMic())) return;
  startRec();
}
function startRec(){
  rec=new SR(); rec.lang=srLang(); rec.continuous=true; rec.interimResults=true;
  rec.onresult=onSpeech;
  rec.onerror=e=>{ if(e.error==='not-allowed'){ toast(t('micDenied')); stopRec(); } };
  rec.onend=()=>{ if(recActive){ try{rec.start();}catch(e){} } };
  try{ rec.start(); }catch(e){}
  recActive=true; voiceOn=true;
  $('#micDot').classList.add('live'); $('#btnMic').classList.add('on');
  toast(S.voiceMode==='follow'?t('voiceFollowOn'):t('voiceCmdOn',{cmds:cmdHelp().replace(/<\/?b>/g,'')}),2600);
  vfReset(); if(S.voiceMode==='follow'){ playing=true; setPlayBtn(); anchorAtGuide(); updVoiceHud(); }
}
function stopRec(){
  recActive=false; voiceOn=false; voiceTarget=null; vfHold=false;
  try{ rec&&rec.stop(); }catch(e){}
  $('#micDot').classList.remove('live','hold'); $('#btnMic').classList.remove('on');
  if(S.voiceMode==='follow'){ playing=false; setPlayBtn(); setPos(pos); }
}
/* ============ Sprachfolge 2.0 ============
   Jedes erkannte Wort wird genau einmal ausgewertet (Zwischenergebnisse wiederholen
   sonst dieselben Wörter und schieben den Text immer weiter). Gesucht wird nur in einem
   kleinen Fenster hinter der aktuellen Stelle; weiter entfernte Treffer brauchen zwei
   Wörter in Folge. Passt nichts (freie Rede, Anekdote), bleibt der Text einfach stehen. */
const VF={WIN:10, NEAR:2, HOLD_AFTER:6};
let vfSession=0, vfKey=null, vfDone=0, vfPrev=null, cmdBuf=[];
function vfReset(){ vfSession++; vfKey=null; vfDone=0; vfPrev=null; cmdBuf=[]; offScript=0; vfHold=false; }
function onSpeech(ev){
  for(let i=ev.resultIndex;i<ev.results.length;i++){
    const r=ev.results[i], key=(ev.__utt!=null)?'a'+ev.__utt:'w'+vfSession+':'+i;
    vfFeed(key, r[0].transcript||'', !!r.isFinal);
  }
}
function vfFeed(key,text,isFinal){
  const words=text.trim().split(/\s+/).map(norm).filter(Boolean);
  if(key!==vfKey||words.length<vfDone-1){ vfKey=key; vfDone=0; }
  /* Das letzte Wort eines Zwischenergebnisses ist oft noch unsicher – erst übernehmen,
     wenn danach weitergesprochen wird oder das Ergebnis endgültig ist (Sprachfolge). */
  const upto=(isFinal||S.voiceMode==='commands')?words.length:Math.max(vfDone,words.length-1);
  const fresh=words.slice(vfDone,upto); vfDone=Math.max(vfDone,upto);
  if(isFinal){ vfKey=null; vfDone=0; }
  if(!fresh.length) return;
  if(S.voiceMode==='commands'){ cmdBuf=cmdBuf.concat(fresh).slice(-5); if(handleCommands(cmdBuf)) cmdBuf=[]; return; }
  if(!playing) return;                       /* angehalten: zuhören, aber nichts bewegen */
  let moved=false;
  for(const w of fresh){ if(followWord(w)) moved=true; vfPrev=w; }
  if(moved) showProgress();
  updVoiceHud();
}
function matchWord(a,b){
  if(!a||!b) return false;
  if(a===b) return true;
  if(a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a))) return true;
  return false;
}
function nextVoice(from,n){ const out=[]; for(let j=from+1;j<tokens.length&&out.length<n;j++) if(tokens[j].voice) out.push(j); return out; }
function followWord(w){
  const cand=nextVoice(matchedIdx,VF.WIN);
  for(let k=0;k<cand.length;k++){
    const j=cand[k];
    if(!matchWord(tokens[j].norm,w)) continue;
    /* Bestätigung durch das vorher gehörte Wort an der Stelle direkt davor */
    const before=[k>0?cand[k-1]:matchedIdx, k>1?cand[k-2]:-1].filter(x=>x>=0);
    const seq=!!vfPrev&&before.some(x=>matchWord(tokens[x].norm,vfPrev));
    const solid=w.length>=4;
    let ok;
    if(vfHold) ok=seq||(k===0&&solid);           /* zurück im Text: vorsichtig wieder einsteigen */
    else if(k===0) ok=true;                       /* genau das nächste Wort */
    else if(k<=VF.NEAR) ok=solid||seq;            /* ein, zwei Wörter verschluckt */
    else ok=seq;                                  /* weiter vorn nur mit zwei Wörtern in Folge */
    if(ok){ matchedIdx=j; offScript=0; vfHold=false; return true; }
  }
  if(++offScript>=VF.HOLD_AFTER) vfHold=true;    /* freie Rede: Text bleibt stehen */
  return false;
}
function showProgress(){
  if(matchedIdx<0||!tokens[matchedIdx]) return;
  const lo=Math.min(shownIdx,matchedIdx), hi=Math.max(shownIdx,matchedIdx);
  for(let i=Math.max(0,lo);i<=hi&&i<tokens.length;i++){
    tokens[i].el.classList.toggle('read',i<matchedIdx);
    tokens[i].el.classList.toggle('now',i===matchedIdx);
  }
  shownIdx=matchedIdx;
  const el=tokens[matchedIdx].el;
  const target=Math.min(maxPos,Math.max(0,el.offsetTop-guidePx()+el.offsetHeight/2));
  /* nur vorwärts – ein Rücksprung würde den Redner aus dem Konzept bringen */
  if(voiceTarget==null||target>voiceTarget) voiceTarget=Math.max(target,voiceTarget==null?pos:voiceTarget);
}
/* Stelle an der Leselinie als „hier geht es weiter“ übernehmen (nach Wischen, Pfeiltasten, Fortsetzen) */
function anchorAtGuide(){
  if(!tokens.length) return;
  const y=pos+guidePx()-S.fontSize*S.lineHeight*.5;
  let idx=tokens.findIndex(x=>x.el.offsetTop+x.el.offsetHeight>y);
  if(idx<0) idx=tokens.length;
  setAnchor(idx-1);
}
function setAnchor(i){
  matchedIdx=Math.max(-1,Math.min(tokens.length-1,i)); offScript=0; vfHold=false; vfPrev=null;
  tokens.forEach((x,n)=>{ x.el.classList.toggle('read',n<=matchedIdx); x.el.classList.remove('now'); });
  shownIdx=matchedIdx; voiceTarget=null;
}
/* Wort antippen (nur bei aktiver Sprachfolge): ab diesem Wort weiterlesen */
function tapWord(el){
  if(!(voiceOn&&S.voiceMode==='follow')||!el||!el.classList||!el.classList.contains('w')) return false;
  const i=tokens.findIndex(x=>x.el===el); if(i<0) return false;
  setAnchor(i-1); playing=true; setPlayBtn();
  voiceTarget=Math.min(maxPos,Math.max(0,el.offsetTop-guidePx()+el.offsetHeight/2));
  el.classList.add('now'); updVoiceHud(); toast(t('voiceJump'),1200);
  return true;
}
function setHold(h){ vfHold=h; offScript=0; updVoiceHud(); }
function updVoiceHud(){
  const on=voiceOn&&S.voiceMode==='follow';
  $('#micDot').classList.toggle('hold',on&&(vfHold||!playing));
  if(on){ const tl=$('#timeLeft');
    if(!playing) tl.textContent=t('voicePaused'); else if(vfHold) tl.textContent=t('voiceWaiting');
    else tl.innerHTML='<svg aria-hidden="true"><use href="#i-mic"/></svg>'; }
}
/* Sprachbefehle in der Erkennungssprache; Wortgrenzen auch bei Akzenten (á, è, ü …) */
function handleCommands(words){
  const line=' '+words.join(' ')+' ', c=cmdSet();
  const has=list=>list.some(p=>line.includes(' '+p.split(/\s+/).map(norm).join(' ')+' '));
  if(has(c.restart)){ restart(); toast(t('backToStart'),800); }
  else if(has(c.faster)){ S.speed=Math.min(400,Math.round(S.speed*1.25)); syncDrawer(); toast(t('speedToast',{v:S.speed+' px/s'}),800); }
  else if(has(c.slower)){ S.speed=Math.max(10,Math.round(S.speed/1.25)); syncDrawer(); toast(t('speedToast',{v:S.speed+' px/s'}),800); }
  else if(has(c.stop)){ pause(); }
  else if(has(c.start)){ if(!playing) play(); }
  else return false;
  return true;   /* Befehl ausgeführt: Puffer leeren, damit er nicht doppelt greift */
}

/* ============ Kamera & Aufnahme ============ */
let camStream=null, facing='user', recorder=null, chunks=[], recT0=0, recIv=null;
function camError(e){
  const n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError') return t('camDenied');
  if(n==='NotReadableError'||n==='AbortError') return t('camBusy');
  if(n==='NotFoundError'||n==='OverconstrainedError') return t('camNone');
  return t('camFail');
}
/* Fix 1.1.0: Bild und Ton getrennt behandeln. Schlägt der Ton fehl,
   läuft die Kamera trotzdem (Video ohne Ton) statt komplett abzubrechen. */
async function startCam(){
  if(camStream) return true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast(t('camFail')); return false; }
  const video={facingMode:facing};
  let s=null, noAudio=false;
  try{ s=await navigator.mediaDevices.getUserMedia({video,audio:true}); }
  catch(e){
    try{ s=await navigator.mediaDevices.getUserMedia({video}); noAudio=true; }
    catch(e2){ toast(camError(e2),3500); return false; }
  }
  if(!s.getAudioTracks().length) noAudio=true;
  camStream=s;
  const v=$('#camVideo'); v.srcObject=camStream; v.style.display='block';
  v.classList.toggle('mirror',facing==='user');
  $('#btnCam').classList.add('on'); $('#btnFlip').style.display='grid';
  applyStyle();
  if(noAudio) toast(t('camNoAudio'),3500);
  return true;
}
function stopCam(){
  if(recorder&&recorder.state!=='inactive') stopRecVideo();
  camStream&&camStream.getTracks().forEach(x=>x.stop()); camStream=null;
  const v=$('#camVideo'); v.srcObject=null; v.style.display='none';
  $('#btnCam').classList.remove('on'); $('#btnFlip').style.display='none';
  applyStyle();
}
async function camToggle(){ if(camStream) stopCam(); else await startCam(); }
async function flipCam(){
  if(!camStream) return;
  if(recorder&&recorder.state!=='inactive') stopRecVideo();
  facing=facing==='user'?'environment':'user';
  camStream.getTracks().forEach(x=>x.stop()); camStream=null;
  await startCam();
}
/* Rechts auf dem Steuerkreuz: Aufnahme an/aus – schaltet die Kamera bei Bedarf ein */
async function recPress(){
  if(recorder&&recorder.state==='recording'){ stopRecVideo(); return; }
  if(!camStream){ if(!(await startCam())) return; await new Promise(r=>setTimeout(r,500)); }
  startRecVideo();
}
function startRecVideo(){
  if(!camStream) return;
  chunks=[];
  if(!window.MediaRecorder){ toast(t('recUnsupported')); return; }
  const hasAudio=camStream.getAudioTracks().length>0;
  let opts={mimeType:hasAudio?'video/webm;codecs=vp8,opus':'video/webm;codecs=vp8'};
  if(!MediaRecorder.isTypeSupported(opts.mimeType)) opts={};
  try{ recorder=new MediaRecorder(camStream,opts); }catch(e){ toast(t('recFail')); return; }
  const vName='PromptAir_'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'.webm';
  const sink=App?appSink(vName,'video/webm','video'):null;
  if(App&&!sink){ toast(t('save_failed')); return; }
  recorder.ondataavailable=e=>{ if(!e.data.size) return; if(sink) sink.push(e.data); else chunks.push(e.data); };
  recorder.onstop=async()=>{
    if(sink){ toast(t('videoSaving'),4000); toast(t(await sink.close()),3000); return; }
    const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=vName; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    toast(t('videoSavedWeb'));
  };
  try{ recorder.start(250); }catch(e){ toast(t('recFail')); return; }
  recT0=Date.now();
  $('#recBadge').classList.add('on'); $('#btnRec').classList.add('on');
  toast(t('recStarted'),1200);
  recIv=setInterval(()=>{ const s=Math.floor((Date.now()-recT0)/1000);
    $('#recTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },500);
}
function stopRecVideo(){
  try{ recorder.stop(); }catch(e){}
  clearInterval(recIv);
  $('#recBadge').classList.remove('on'); $('#btnRec').classList.remove('on');
}

/* ============ Prompter öffnen/schließen ============ */
async function openPrompt(){
  if(!cur) return;
  buildContent(cur.text||'');
  show('prompt'); applyStyle(); restart(); setPos(0); setPlayBtn(); showCtl();
  lastT=0; cancelAnimationFrame(rafId); rafId=requestAnimationFrame(tick);
  if(App){ App.keepAwake(!!S.keepAwake); App.setFullscreen(true); return; }
  if(S.keepAwake&&navigator.wakeLock){ try{ wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
  try{ if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); }catch(e){}
}
function exitPrompt(){
  pause(); stopRec(); stopCam();
  cancelAnimationFrame(rafId);
  wakeLock&&wakeLock.release&&wakeLock.release(); wakeLock=null;
  if(App){ App.keepAwake(false); App.setFullscreen(false); }
  try{ document.fullscreenElement&&document.exitFullscreen(); }catch(e){}
  show('edit');
}
let appFS=false;
function toggleFS(){ if(App){ appFS=!appFS; App.setFullscreen(appFS); return; } try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(e){} }
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&views.prompt.classList.contains('on')&&S.keepAwake&&navigator.wakeLock&&!App){
    try{ wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
  }
});
window.addEventListener('resize',()=>{ if(views.prompt.classList.contains('on')) applyStyle(); });

$('#btnPrompt').onclick=openPrompt;
$('#btnExit').onclick=exitPrompt;
$('#btnPlay').onclick=()=>{ playing?pause():play(); };
$('#btnRestart').onclick=restart;
$('#btnSlower').onclick=()=>{ changeSpeed(-10); showCtl(); };
$('#btnFaster').onclick=()=>{ changeSpeed(10); showCtl(); };
$('#btnMic').onclick=()=>{ micToggle(); showCtl(); };
$('#btnRec').onclick=()=>{ recPress(); showCtl(); };
$('#btnCam').onclick=camToggle;
$('#btnFlip').onclick=flipCam;
$('#btnMirror').onclick=()=>{ S.mirrorH=!S.mirrorH; applyStyle(); syncDrawer(); saveSettings(); };
$('#btnGear').onclick=openDrawer;
$('#permClose').onclick=()=>$('#permDlg').style.display='none';
$('#permRetry').onclick=()=>{ const r=$('#permDlg')._retry; $('#permDlg').style.display='none'; r&&r(); };

/* ============ Startsequenz (App) ============ */
(function intro(){
  const el=$('#intro');
  if(!el) return;
  if(!document.documentElement.classList.contains('intro')){ el.remove(); return; }
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tile=el.querySelector('.intro-tile');
  // Start in Kachelgröße (wie das App-Symbol auf dem Startbildschirm, ~64 px)
  tile.style.setProperty('--s0',Math.min(1,64/Math.max(1,tile.offsetWidth)).toFixed(3));
  requestAnimationFrame(()=>el.classList.add('run'));
  let done=false;
  const end=()=>{ if(done) return; done=true; el.classList.add('out');
    setTimeout(()=>{ el.remove(); document.documentElement.classList.remove('intro'); },480); };
  setTimeout(end,reduce?700:3100);
  el.addEventListener('click',end);
})();

/* ============ Start ============ */
loadAll().then(()=>{ setUiLang(S.uiLang); syncDrawer(); });

</script>
